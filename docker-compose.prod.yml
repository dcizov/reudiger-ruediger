services:
  discord-bot:
    container_name: reudiger-ruediger-prod
    build:
      target: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres-db:5432/${DATABASE_NAME:-reudiger-ruediger}
    command: ['npm', 'start']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
    networks:
      - reudiger-network

  migrate:
    build:
      context: .
      target: builder
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres-db:5432/${DATABASE_NAME:-reudiger-ruediger}
    command: npm run migrate
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - reudiger-network
    restart: 'no'

  postgres-db:
    container_name: reudiger-ruediger-postgres-prod
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-reudiger-ruediger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports: []
    networks:
      - reudiger-network

volumes:
  pgdata:
    name: reudiger-ruediger-pgdata-prod

networks:
  reudiger-network:
    driver: bridge

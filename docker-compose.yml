services:
  migrate:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Override DATABASE_URL for Docker (use postgres-db hostname)
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres-db:5432/${DATABASE_NAME}
    command: npm run migrate
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - reudiger-network
    restart: "no"

  discord-bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Override DATABASE_URL for Docker (use postgres-db hostname)
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres-db:5432/${DATABASE_NAME}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
    networks:
      - reudiger-network

  postgres-db:
    container_name: '${DATABASE_NAME:-reudiger-ruediger}-postgres-dev'
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-reudiger-ruediger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - reudiger-network

volumes:
  pgdata:
    name: '${DATABASE_NAME:-reudiger-ruediger}-pgdata'

networks:
  reudiger-network:
    driver: bridge

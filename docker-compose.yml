services:
  discord-bot:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres-db

  postgres-db:
    container_name: '${DB_NAME:-sample-bot}-postgres'
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
    name: '${DB_NAME:-sample-bot}-pgdata'

services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped

    # Inject env vars from your host .env
    env_file:
      - .env

    # (Optional for local dev) bind-mount your source code
    # → but note this will hide the built dist/ if you mount over /app
    # If you only want to use “npm run dev” with tsx, uncomment:
    # volumes:
    #   - ./:/app
    #   - /app/node_modules

    # For production use the built image:
    command: ["node", "dist/index.js"]
